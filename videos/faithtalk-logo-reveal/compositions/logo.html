<script>

// Precomputed perspective edge; no layout measurements or event callbacks.

const moveEase=gsap.parseEase("power2.inOut");
const dipEase=gsap.parseEase("sine.out");
const recoverEase=gsap.parseEase("power2.out");
const settleEase=gsap.parseEase("power2.inOut");
const pivotX=3840*.229986, tipX=1176.57, wordLeft=(295+74.191*4.449470)*2, perspective=1800;
function wordApproach(sampleTime){
  // Only the word timing stretches, anchored to its unchanged 2.64s entry.
  const t=sampleTime<=2.64?sampleTime:2.64+(sampleTime-2.64)/1.05;
  const lagProgress=clamp01((t-2.74)/.50);
  const followTime=t-.12*lagProgress*lagProgress*(3-2*lagProgress);
  const x=TRAVEL*2*(1-moveEase(clamp01((followTime-2.40)/.94)));

  const prev=approachStart+(approachEnd-approachStart)*(i-1)/approachSteps;
  approachFrames.push({x:wordApproach(t),duration:t-prev,ease:"none"});

tl.to(".fx",{keyframes:approachFrames,ease:"none"},approachStart);
tl.set(".fx",{x:0},approachEnd);
