<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" role="img" aria-label="Singleton Systems apple icon">
  <style>
    :root { color-scheme: light dark; }
    .tile { fill: #ffffff; }
    .mark { fill: #050505; }
    .dot { fill: #2383e2; }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #050505; }
      .mark { fill: #ffffff; }
      .dot { fill: #35a8ff; }
    }
  </style>
  <rect x="11" y="11" width="158" height="158" rx="45" class="tile"/>
  <text x="90" y="111" text-anchor="middle" class="mark" font-family="Geist, Inter, Arial, sans-serif" font-size="62" font-weight="800" letter-spacing="-4">s.s</text>
  <circle cx="146" cy="34" r="11" class="dot"/>
</svg>
