<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Dated Singleton Systems visual maps and working canvases." />
    <title>Visual maps — Singleton Systems</title>
    <style>
      :root {
        --paper: #f7f7f5;
        --ink: #111318;
        --muted: #667085;
        --line: rgba(17, 19, 24, 0.16);
        --blue: #2383e2;
        --yellow: #ffc83d;
        --coral: #ff6257;
        --green: #25c266;
      }

      * { box-sizing: border-box; }
      html { background: var(--paper); }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--paper);
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        line-height: 1.35;
      }

      a { color: inherit; text-decoration: none; }

      .shell {
        width: min(68rem, calc(100% - 2.5rem));
        margin: 0 auto;
        padding: 2.25rem 0 4rem;
      }

      .masthead {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 2rem;
        padding-bottom: 1.4rem;
        border-bottom: 1px solid var(--line);
      }

      .brand { display: inline-flex; width: 8.8rem; transition: opacity 160ms ease; }
      .brand:hover { opacity: .66; }
      .brand:focus-visible, .map-row:focus-visible { outline: 2px solid var(--ink); outline-offset: 5px; }
      .brand img { display: block; width: 100%; height: auto; }

      .color-mark {
        display: inline-grid;
        grid-template-columns: repeat(4, 1fr);
        width: 5.5rem;
        height: .45rem;
        gap: .3rem;
      }

      .color-mark span:nth-child(1) { background: var(--blue); }
      .color-mark span:nth-child(2) { background: var(--yellow); }
      .color-mark span:nth-child(3) { background: var(--coral); }
      .color-mark span:nth-child(4) { background: var(--green); }

      .intro { padding: 4.8rem 0 2.2rem; }

      h1 {
        margin: 0;
        font-size: clamp(3.2rem, 10vw, 7.5rem);
        font-weight: 650;
        letter-spacing: -.075em;
        line-height: .86;
      }

      .intro-mark {
        display: inline-block;
        margin: 0 0 .16em .12em;
        color: var(--blue);
        font-size: .38em;
        vertical-align: top;
      }

      .map-list {
        position: relative;
        border-top: 2px solid var(--ink);
      }

      .map-list::before {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 1.45rem;
        width: 1px;
        background: var(--line);
        content: "";
      }

      .map-row {
        position: relative;
        display: grid;
        grid-template-columns: 3rem minmax(0, 1fr);
        gap: 1.25rem;
        align-items: center;
        min-height: 9rem;
        padding: 1.75rem 0;
        border-bottom: 1px solid var(--line);
        transition: background 160ms ease, padding 160ms ease;
      }

      .map-row:hover { padding-right: .75rem; padding-left: .75rem; background: rgba(255,255,255,.58); }

      .map-node {
        position: relative;
        z-index: 1;
        display: grid;
        width: 2.9rem;
        height: 2.9rem;
        place-items: center;
        border: 2px solid var(--ink);
        border-radius: 50%;
        background: var(--paper);
        font-size: .82rem;
        font-weight: 800;
      }

      .map-row:nth-child(1) .map-node { box-shadow: inset 0 0 0 .45rem #dceeff; }
      .map-row:nth-child(2) .map-node { box-shadow: inset 0 0 0 .45rem #fff1bf; }
      .map-row:nth-child(3) .map-node { box-shadow: inset 0 0 0 .45rem #dcf7e5; }
      .map-row:nth-child(4) .map-node { box-shadow: inset 0 0 0 .45rem #ffe2df; }
      .map-row:nth-child(5) .map-node { box-shadow: inset 0 0 0 .45rem #e9ddff; }

      .map-copy { min-width: 0; }

      .map-title {
        display: block;
        font-size: clamp(1.35rem, 3.4vw, 2.35rem);
        font-weight: 650;
        letter-spacing: -.045em;
        line-height: 1;
      }

      .date-row {
        display: flex;
        align-items: center;
        gap: .7rem;
        margin-top: 1.1rem;
        color: var(--muted);
        font-size: .74rem;
        font-weight: 700;
        letter-spacing: .02em;
      }

      .date-icon {
        display: inline-grid;
        width: 1.35rem;
        height: 1.35rem;
        flex: 0 0 auto;
        place-items: center;
        border: 1px solid var(--ink);
        border-radius: 50%;
        color: var(--ink);
        font-size: .7rem;
      }

      .date-row em { color: var(--ink); font-size: .86rem; font-weight: 600; letter-spacing: 0; }
      .date-rule { height: 1px; min-width: 2rem; flex: 1; background: var(--line); }
      .date-link { color: var(--ink); font-size: .7rem; font-weight: 850; letter-spacing: .12em; text-transform: uppercase; white-space: nowrap; }
      .date-link::after { content: " ↗"; color: var(--blue); }

      .footer {
        display: flex;
        justify-content: space-between;
        gap: 1rem;
        padding-top: 1.2rem;
        color: var(--muted);
        font-size: .74rem;
        font-weight: 700;
      }

      .footer a:hover { color: var(--ink); }

      @media (max-width: 600px) {
        .shell { width: min(100% - 1.5rem, 68rem); padding-top: 1.4rem; }
        .masthead { padding-bottom: 1rem; }
        .brand { width: 7.4rem; }
        .intro { padding: 3.7rem 0 1.7rem; }
        .map-row { grid-template-columns: 2.5rem minmax(0, 1fr); gap: .9rem; min-height: 8.4rem; padding: 1.4rem 0; }
        .map-list::before { left: 1.2rem; }
        .map-node { width: 2.4rem; height: 2.4rem; font-size: .74rem; }
        .date-row { gap: .45rem; flex-wrap: wrap; }
        .date-rule { min-width: 1rem; }
        .date-link { margin-left: auto; }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <header class="masthead">
        <a class="brand" href="/" aria-label="Singleton Systems home">
          <img src="/singleton-systems-wordmark.svg" alt="Singleton Systems" width="660" height="260" />
        </a>
        <span class="color-mark" aria-label="Singleton Systems color mark"><span></span><span></span><span></span><span></span></span>

      <section class="intro" aria-labelledby="page-title">

      <section class="map-list" aria-label="Dated visual maps">
        <a class="map-row" href="/visual-maps/2026-08-04-ai-upgrade-wayfinder.html">
          <span class="map-node" aria-hidden="true">01</span>

            <strong class="map-title">Gary&apos;s Client Canvas</strong>
            <span class="date-row"><span class="date-icon" aria-hidden="true">✦</span><em>Tuesday — August 4, 2026</em><span class="date-rule" aria-hidden="true"></span><span class="date-link">Link</span></span>
          </span>
        </a>
        <a class="map-row" href="/decision-maps">

          </span>
        </a>
        <a class="map-row" href="/portfolio-c4-plan">
          <span class="map-node" aria-hidden="true">03</span>
          <span class="map-copy">
            <strong class="map-title">Portfolio C4 Plan</strong>
            <span class="date-row"><span class="date-icon" aria-hidden="true">✦</span><em>Saturday — July 5, 2026</em><span class="date-rule" aria-hidden="true"></span><span class="date-link">Link</span></span>
          </span>
        </a>
        <a class="map-row" href="/wemby-shot-lab">
          <span class="map-node" aria-hidden="true">04</span>
          <span class="map-copy">
            <strong class="map-title">Wemby Shot Lab</strong>
            <span class="date-row"><span class="date-icon" aria-hidden="true">✦</span><em>Friday — July 17, 2026</em><span class="date-rule" aria-hidden="true"></span><span class="date-link">Link</span></span>
          </span>
        </a>
        <a class="map-row" href="/ai-starter-guide/">
          <span class="map-node" aria-hidden="true">05</span>
          <span class="map-copy">
            <strong class="map-title">AI Starter Lab</strong>
            <span class="date-row"><span class="date-icon" aria-hidden="true">✦</span><em>Monday — July 6, 2026</em><span class="date-rule" aria-hidden="true"></span><span class="date-link">Link</span></span>
          </span>
        </a>
      </section>

      <footer class="footer"><span>Singleton Systems</span><a href="/">Home ↗</a></footer>
    </main>
  </body>
</html>
