      Copy the table below into your email client's signature editor.

      Changes vs. jerami-singleton.html:
      - Fixed outer card asymmetry (removed stray left margin that made the
        card look off-center; both inner tables now share one width).
      - Added an Outlook (mso) fallback so the rounded corners degrade
        gracefully to square instead of rendering oddly in Outlook desktop.
      - Replaced the phone/globe/envelope emoji glyphs with hosted Phosphor
        "fill" icon SVGs in the brand coral so they stay visible when an
        email client forces the signature into dark mode.
      - LinkedIn, Instagram, and Upwork icons are all colored brand SVGs:
        icons/linkedin-logo-color.svg and icons/instagram-logo-color.svg
        (official Simple Icons glyph shapes, recolored to LinkedIn blue
        and an Instagram-gradient fill) plus icons/upwork-logo.svg
        (user-provided).
      - Tightened the card's side padding (12px -> 8px) and lightened the
        divider line (#e5e7eb -> #edeef1) per feedback that the sides felt
        too wide and the divider too heavy.

      Replace these before final use:
      - Confirm the production domain is still https://singleton-systems.com
      - Confirm /email-signatures/icons/*.svg is deployed at that domain
        before sending — Outlook desktop can be inconsistent with <img
        src="*.svg">; if it renders as broken images there, fall back to
        rasterized PNGs of the same icons (same pattern as the Upwork icon).
    -->
