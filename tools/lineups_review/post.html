<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{title}} · Post-Figma review</title><link rel="stylesheet" href="assets/review-base.css"><link rel="stylesheet" href="assets/asset-selection.css"></head><body><main class="shell">
<header class="top"><span class="meta">Singleton Systems</span><a class="back" href="index.html">Pre-Figma review</a></header>
<p class="meta">{{clientLabel}} · Post-Figma review</p><h1>{{title}}</h1><p class="meta">{{dueLabel}}</p>
<nav class="tabs lane-filters" aria-label="Scene lanes" id="lane-filters"></nav>
<p class="post-count" id="post-count" role="status"></p><div class="list" id="post-scenes"></div><footer class="review-footer" id="post-footer" hidden><button class="tab" id="export-post">Export review choices</button></footer>
<article class="asset empty-review" id="post-empty" hidden><h2>No scene previews yet</h2><p>Choose scenes in the <a href="index.html">Pre-Figma review</a>.</p></article>
</main><dialog class="scene-dialog" id="scene-dialog" aria-labelledby="scene-dialog-title"><div id="scene-detail"></div><button class="tab" id="close-scene">Close</button></dialog>
<script>const reviewData={{reviewData}};</script><script src="assets/visuals.js"></script><script src="assets/post.js"></script></body></html>
