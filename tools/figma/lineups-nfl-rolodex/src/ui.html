<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lineups NFL Rolodex</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      * { box-sizing: border-box; }
      body { margin: 0; padding: 14px; color: var(--figma-color-text); background: var(--figma-color-bg); font-size: 12px; }
      main { display: grid; gap: 12px; }
      h1 { margin: 0; font-size: 18px; }
      p { margin: 4px 0 0; color: var(--figma-color-text-secondary); line-height: 1.45; }
      .panel { padding: 11px; border: 1px solid var(--figma-color-border); border-radius: 8px; background: var(--figma-color-bg-secondary); }
      .label { display: block; margin-bottom: 6px; color: var(--figma-color-text-secondary); font-size: 10px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; }
      .selection { display: grid; gap: 8px; }
      .selection-row { display: flex; justify-content: space-between; gap: 10px; }
      .selection-value { max-width: 250px; overflow: hidden; text-align: right; text-overflow: ellipsis; white-space: nowrap; }
      .search-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
      input, select { width: 100%; min-height: 36px; padding: 8px 9px; border: 1px solid var(--figma-color-border-strong); border-radius: 6px; color: var(--figma-color-text); background: var(--figma-color-bg); font: inherit; }
      button { min-height: 34px; padding: 0 11px; border: 0; border-radius: 6px; color: var(--figma-color-text); background: var(--figma-color-bg-tertiary); font: inherit; font-weight: 650; cursor: pointer; }
      button.primary { color: var(--figma-color-text-onbrand); background: var(--figma-color-bg-brand); }
      button:disabled { cursor: not-allowed; opacity: .45; }
      .tabs { display: flex; gap: 8px; }
      .tabs button[aria-pressed="true"] { color: var(--figma-color-text-onbrand); background: var(--figma-color-bg-brand); }
      #results { display: grid; gap: 8px; max-height: 300px; overflow: auto; }
      .card { display: grid; grid-template-columns: 76px 1fr; gap: 10px; padding: 8px; border: 1px solid var(--figma-color-border); border-radius: 8px; }
      .card img { width: 76px; height: 76px; border-radius: 6px; background: var(--figma-color-bg-tertiary); object-fit: cover; }
      .card h2 { margin: 0; font-size: 13px; }
      .meta { margin-top: 3px; color: var(--figma-color-text-secondary); line-height: 1.35; }
      .badge { display: inline-block; margin-top: 5px; padding: 2px 6px; border-radius: 999px; color: var(--figma-color-text-warning); background: var(--figma-color-bg-warning-tertiary); font-size: 10px; }
      .license { display: inline-block; margin-top: 5px; padding: 2px 6px; border-radius: 999px; color: var(--figma-color-text-success); background: var(--figma-color-bg-success-tertiary); font-size: 10px; }
      .actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
      .status { min-height: 34px; padding: 8px 10px; border-radius: 6px; color: var(--figma-color-text-secondary); background: var(--figma-color-bg-secondary); line-height: 1.4; }
      .status.error { color: var(--figma-color-text-danger); background: var(--figma-color-bg-danger-tertiary); }
      .status.success { color: var(--figma-color-text-success); background: var(--figma-color-bg-success-tertiary); }
      .empty { padding: 16px; color: var(--figma-color-text-secondary); text-align: center; }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Lineups NFL Rolodex</h1>
        <p>Search Eagle. Preview one result. Insert it into the current frame.</p>
      </header>

      <section class="panel selection">
        <span class="label">Figma target</span>
        <div class="selection-row"><span>Selection</span><span class="selection-value" id="selection-name">None</span></div>
        <label>
          <span class="label">Image fill</span>
          <select id="fill-target" disabled><option value="">No image fill found</option></select>
        </label>
      </section>

      <section>
        <div class="search-row">
          <input id="query" type="search" placeholder="Patrick Mahomes, Chiefs, coach, QB…" autocomplete="off" />
          <button class="primary" id="search">Search</button>
        </div>
      </section>

      <nav class="tabs" aria-label="Result mode">
        <button id="search-tab" aria-pressed="true">Search results</button>
        <button id="review-tab" aria-pressed="false">Needs identification</button>
        <button id="openverse-tab" aria-pressed="false">Find missing</button>
      </nav>

      <section id="results" aria-live="polite"><div class="empty">Start with a player, coach, team, or position.</div></section>
      <div class="status" id="status" role="status">Bridge check pending.</div>
    </main>

    <script>
      const BRIDGE = "http://localhost:41723";
      const query = document.getElementById("query");
      const search = document.getElementById("search");
      const results = document.getElementById("results");
      const status = document.getElementById("status");
      const selectionName = document.getElementById("selection-name");
      const fillTarget = document.getElementById("fill-target");
      const searchTab = document.getElementById("search-tab");
      const reviewTab = document.getElementById("review-tab");
      const openverseTab = document.getElementById("openverse-tab");
      let snapshot = { canInsert: false, fillTargets: [], suggestedTargetId: null };
      let currentMode = "search";

      function setStatus(message, kind = "") {
        status.className = `status ${kind}`.trim();
        status.textContent = message;
      }

      function setMode(mode) {
        currentMode = mode;
        searchTab.setAttribute("aria-pressed", String(mode === "search"));
        reviewTab.setAttribute("aria-pressed", String(mode === "review"));
        openverseTab.setAttribute("aria-pressed", String(mode === "openverse"));
      }

      function renderOpenverseCandidates(candidates) {
        results.replaceChildren();
        if (!candidates.length) {
          const empty = document.createElement("div");
          empty.className = "empty";
          empty.textContent = "No licensed Openverse candidates found.";
          results.appendChild(empty);
          return;
        }

        for (const candidate of candidates) {
          const card = document.createElement("article");
          card.className = "card";
          const image = document.createElement("img");
          image.src = `${BRIDGE}${candidate.previewUrl}`;
          image.alt = candidate.title;
          const body = document.createElement("div");
          const title = document.createElement("h2");
          title.textContent = candidate.title;
          const creator = document.createElement("div");
          creator.className = "meta";
          creator.textContent = `${candidate.creator} · ${candidate.source}`;
          const dimensions = document.createElement("div");
          dimensions.className = "meta";
          dimensions.textContent = candidate.width && candidate.height
            ? `${candidate.width} × ${candidate.height} · confidence ${candidate.confidence}`
            : `Dimensions unknown · confidence ${candidate.confidence}`;
          const license = document.createElement("span");
          license.className = "license";
          license.textContent = [candidate.license, candidate.licenseVersion].filter(Boolean).join(" ");
          const badge = document.createElement("span");
          badge.className = "badge";
          badge.textContent = "Review before Eagle import";
          const actions = document.createElement("div");
          actions.className = "actions";
          actions.append(
            button("Open source", "", () => {
              post({ type: "open-external", url: candidate.sourcePageUrl });
            }, !candidate.sourcePageUrl),
            button("Import disabled", "primary", () => {}, true),
          );
          body.append(title, creator, dimensions, license, document.createTextNode(" "), badge, actions);
          card.append(image, body);
          results.appendChild(card);
        }
      }

      function post(pluginMessage) {
        parent.postMessage({ pluginMessage }, "*");
      }

      function button(label, className, onClick, disabled) {
        const element = document.createElement("button");
        element.textContent = label;
        element.className = className;
        element.disabled = disabled;
        element.addEventListener("click", onClick);
        return element;
      }

      function renderItems(items) {
        results.replaceChildren();
        if (!items.length) {
          const empty = document.createElement("div");
          empty.className = "empty";
          empty.textContent = "No matching Eagle images.";
          results.appendChild(empty);
          return;
        }

        for (const item of items) {
          const card = document.createElement("article");
          card.className = "card";
          const image = document.createElement("img");
          image.src = `${BRIDGE}${item.previewUrl}`;
          image.alt = item.person;
          const body = document.createElement("div");
          const title = document.createElement("h2");
          title.textContent = item.person;
          const meta = document.createElement("div");
          meta.className = "meta";
          meta.textContent = `${item.team} · ${item.role} · ${item.position} · ${item.imageContext}`;
          const current = document.createElement("div");
          current.className = "meta";
          current.textContent = `Eagle: ${item.currentName}`;
          body.append(title, meta, current);
          if (item.needsReview) {
            const badge = document.createElement("span");
            badge.className = "badge";
            badge.textContent = "Needs identification review";
            body.appendChild(badge);
          }
          const actions = document.createElement("div");
          actions.className = "actions";
          actions.append(
            button("Replace fill", "primary", () => {
              post({ type: "insert", mode: "replace", item, targetId: fillTarget.value });
            }, !fillTarget.value),
            button("Insert layer", "", () => {
              post({ type: "insert", mode: "insert", item });
            }, !snapshot.canInsert),
          );
          body.appendChild(actions);
          card.append(image, body);
          results.appendChild(card);
        }
      }

      async function load(path, loadingMessage) {
        setStatus(loadingMessage);
        try {
          const response = await fetch(`${BRIDGE}${path}`);
          const payload = await response.json();
          if (!response.ok) throw new Error(payload.error || `Bridge returned ${response.status}`);
          renderItems(payload.items || []);
          setStatus(`${payload.items?.length || 0} Eagle image${payload.items?.length === 1 ? "" : "s"} found.`, "success");
        } catch (error) {
          renderItems([]);
          setStatus(`${error.message} Start the local bridge with npm run bridge.`, "error");
        }
      }

      async function runSearch() {
        const value = query.value.trim();
        if (!value) return;
        if (currentMode === "openverse") {
          setStatus(`Searching Openverse for “${value}”…`);
          try {
            const response = await fetch(`${BRIDGE}/api/acquisition/openverse?q=${encodeURIComponent(value)}`);
            const payload = await response.json();
            if (!response.ok) throw new Error(payload.error || `Bridge returned ${response.status}`);
            renderOpenverseCandidates(payload.candidates || []);
            setStatus(`${payload.candidates?.length || 0} licensed candidate${payload.candidates?.length === 1 ? "" : "s"}. Eagle unchanged.`, "success");
          } catch (error) {
            renderOpenverseCandidates([]);
            setStatus(error.message, "error");
          }
          return;
        }
        setMode("search");
        await load(`/api/search?q=${encodeURIComponent(value)}`, `Searching Eagle for “${value}”…`);
      }

      search.addEventListener("click", runSearch);
      query.addEventListener("keydown", (event) => { if (event.key === "Enter") runSearch(); });
      searchTab.addEventListener("click", () => { setMode("search"); if (query.value.trim()) runSearch(); });
      reviewTab.addEventListener("click", () => { setMode("review"); load("/api/needs-identification", "Loading review items…"); });
      openverseTab.addEventListener("click", () => {
        setMode("openverse");
        if (query.value.trim()) runSearch();
        else {
          results.innerHTML = '<div class="empty">Enter a missing player or coach name.</div>';
          setStatus("Openverse searches licensed web images. Import requires review.");
        }
      });

      onmessage = (event) => {
        const message = event.data.pluginMessage;
        if (!message) return;
        if (message.type === "selection") {
          snapshot = message.payload;
          selectionName.textContent = snapshot.selectedName || "None";
          fillTarget.replaceChildren();
          if (!snapshot.fillTargets.length) {
            fillTarget.appendChild(new Option("No image fill found", ""));
            fillTarget.disabled = true;
          } else {
            for (const target of snapshot.fillTargets) fillTarget.appendChild(new Option(target.name, target.id));
            fillTarget.value = snapshot.suggestedTargetId || snapshot.fillTargets[0].id;
            fillTarget.disabled = false;
          }
          return;
        }
        if (message.type === "working") setStatus(message.message);
        if (message.type === "success") setStatus(`${message.message} Eagle ID ${message.eagleItemId}.`, "success");
        if (message.type === "error") setStatus(message.message, "error");
      };

      post({ type: "refresh-selection" });
      fetch(`${BRIDGE}/health`)
        .then((response) => { if (!response.ok) throw new Error(); setStatus("Bridge connected. Search is ready.", "success"); })
        .catch(() => setStatus("Start the local bridge with npm run bridge.", "error"));
    </script>
  </body>
</html>
