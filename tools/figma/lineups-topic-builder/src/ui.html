<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lineups Topic Builder</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        padding: 16px;
        color: var(--figma-color-text);
        background: var(--figma-color-bg);
        font-size: 12px;
      }

      h1 {
        margin: 0 0 6px;
        font-size: 18px;
        line-height: 1.2;
      }

      p {
        margin: 0;
        color: var(--figma-color-text-secondary);
        line-height: 1.45;
      }

      .stack { display: grid; gap: 12px; }

      .panel {
        padding: 12px;
        border: 1px solid var(--figma-color-border);
        border-radius: 8px;
        background: var(--figma-color-bg-secondary);
      }

      .label {
        display: block;
        margin-bottom: 6px;
        color: var(--figma-color-text-secondary);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .selection-line {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        padding: 5px 0;
      }

      .selection-line + .selection-line { border-top: 1px solid var(--figma-color-border); }
      .selection-value { text-align: right; font-weight: 600; }

      input {
        width: 100%;
        min-height: 44px;
        padding: 10px 11px;
        border: 1px solid var(--figma-color-border-strong);
        border-radius: 6px;
        color: var(--figma-color-text);
        background: var(--figma-color-bg);
        font: inherit;
      }

      input:focus {
        border-color: var(--figma-color-border-brand-strong);
        outline: 2px solid var(--figma-color-border-brand);
        outline-offset: 1px;
      }

      .actions { display: grid; grid-template-columns: 1fr auto; gap: 8px; }

      button {
        min-height: 36px;
        padding: 0 12px;
        border: 0;
        border-radius: 6px;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }

      button.primary {
        color: var(--figma-color-text-onbrand);
        background: var(--figma-color-bg-brand);
      }

      button.secondary {
        color: var(--figma-color-text);
        background: var(--figma-color-bg-tertiary);
      }

      button:disabled { cursor: not-allowed; opacity: 0.45; }

      .status {
        min-height: 34px;
        padding: 8px 10px;
        border-radius: 6px;
        line-height: 1.4;
      }

      .status.neutral { color: var(--figma-color-text-secondary); background: var(--figma-color-bg-secondary); }
      .status.error { color: var(--figma-color-text-danger); background: var(--figma-color-bg-danger-tertiary); }
      .status.success { color: var(--figma-color-text-success); background: var(--figma-color-bg-success-tertiary); }

      ul { margin: 6px 0 0; padding-left: 18px; }
    </style>
  </head>
  <body>
    <main class="stack">
      <header>
        <h1>Lineups Topic Builder</h1>
        <p>Select one Lineups instance and 1–4 transparent athlete images.</p>
      </header>

      <section class="panel" aria-labelledby="selection-label">
        <span class="label" id="selection-label">Selection</span>
        <div class="selection-line">
          <span>Target</span>
          <span class="selection-value" id="target">None</span>
        </div>
        <div class="selection-line">
          <span>Player art</span>
          <span class="selection-value" id="players">0 selected</span>
        </div>
      </section>

      <label>
        <span class="label">Headline</span>
        <input id="headline" maxlength="140" placeholder="WHO HAS THE BETTER FIVE-YEAR WINDOW?" />
      </label>

      <div class="actions">
        <button class="primary" id="generate" disabled>Generate scene</button>
        <button class="secondary" id="refresh">Refresh</button>
      </div>

      <div class="status neutral" id="status" role="status">Waiting for a valid selection.</div>
    </main>

    <script>
      const target = document.getElementById("target");
      const players = document.getElementById("players");
      const headline = document.getElementById("headline");
      const generate = document.getElementById("generate");
      const refresh = document.getElementById("refresh");
      const status = document.getElementById("status");
      let selectionValid = false;

      function setStatus(message, kind = "neutral") {
        status.className = `status ${kind}`;
        status.textContent = message;
      }

      function updateGenerateState() {
        generate.disabled = !selectionValid || !headline.value.trim();
      }

      headline.addEventListener("input", updateGenerateState);
      headline.addEventListener("keydown", (event) => {
        if (event.key === "Enter" && !generate.disabled) generate.click();
      });

      refresh.addEventListener("click", () => {
        parent.postMessage({ pluginMessage: { type: "refresh-selection" } }, "*");
      });

      generate.addEventListener("click", () => {
        generate.disabled = true;
        parent.postMessage(
          { pluginMessage: { type: "generate", headline: headline.value.trim() } },
          "*",
        );
      });

      onmessage = (event) => {
        const message = event.data.pluginMessage;
        if (!message) return;

        if (message.type === "selection") {
          const { payload } = message;
          selectionValid = payload.valid;
          target.textContent = payload.target?.name ?? "None";
          players.textContent = `${payload.images.length} selected`;
          setStatus(
            payload.valid ? "Ready to build a cloned scene." : payload.errors.join(" "),
            payload.valid ? "neutral" : "error",
          );
          updateGenerateState();
          return;
        }

        if (message.type === "working") {
          setStatus(message.message);
          generate.disabled = true;
          return;
        }

        if (message.type === "success") {
          const warningText = message.warnings.length ? ` ${message.warnings.join(" ")}` : "";
          setStatus(`Created ${message.sceneName}.${warningText}`, "success");
          selectionValid = false;
          updateGenerateState();
          return;
        }

        if (message.type === "error") {
          setStatus(message.message, "error");
          updateGenerateState();
        }
      };
    </script>
  </body>
</html>
