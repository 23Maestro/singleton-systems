<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
/* UXP supports none/inline/block/inline-block/flex/inline-flex only.
   No CSS grid, and native <button> ignores most custom styling, so every
   interactive control here is a styled div laid out with flex. */
:root{
  --bg:#0A0A0A; --raise:#161616; --raise-hi:#1F1F1F; --line:#2C2C2C;
  --text:#F2F2F2; --dim:#8C8C8C; --warn:#E0B467; --err:#E0574F;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--text); padding:10px 10px 12px;
  font:12px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
}

.head{display:flex; flex-direction:column; margin-bottom:10px}
.title{font-size:13px; font-weight:700; letter-spacing:-.01em}
.sub{color:var(--dim); font-size:10.5px; margin-top:1px}

/* scope toggle */
.scope{display:flex; flex-direction:row; background:var(--raise);
  border:1px solid var(--line); border-radius:8px; padding:3px; margin-bottom:10px}
.scope .opt{flex:1; display:flex; align-items:center; justify-content:center;
  padding:6px 4px; border-radius:5px; color:var(--dim); font-weight:600;
  font-size:11px; cursor:pointer}
.scope .opt.on{background:var(--raise-hi); color:var(--text)}

/* preset list */
.list{display:flex; flex-direction:column}
.list.busy{opacity:.4}
.row{display:flex; flex-direction:row; align-items:center;
  background:var(--raise); border:1px solid var(--line); border-left-width:3px;
  border-radius:8px; padding:8px 10px; margin-bottom:6px; cursor:pointer}
.row:hover{background:var(--raise-hi)}

.copy{display:flex; flex-direction:column; flex:1; min-width:0}
.name{font-size:12px; font-weight:700; letter-spacing:-.01em}
.desc{color:var(--dim); font-size:10px; margin-top:2px}

/* scale curve, drawn as flex bars — UXP will not render runtime-injected SVG */
.spark{display:flex; flex-direction:row; align-items:flex-end;
  width:52px; height:18px; margin-left:10px}
.bar{flex:1; margin-left:1px; border-radius:1px; min-height:2px}

.badge{margin-left:10px; width:62px; text-align:right;
  font-size:9.5px; font-weight:700; color:var(--dim)}

#status{color:var(--dim); font-size:10.5px; margin-top:8px; min-height:14px}
#status.err{color:var(--err)}
#status.warn{color:var(--warn)}
</style>
</head>
<body>

<div class="head">
  <div class="title">Zoom Motion</div>
  <div class="sub">Transform-effect presets. Intrinsic Motion is never touched.</div>
</div>

<div class="scope" id="scope">
  <div class="opt on" data-mode="selection">Selected clip</div>
  <div class="opt" data-mode="all">All clips</div>
</div>

<div class="list" id="list"></div>

<div id="status">Pick a preset to apply it.</div>

<script src="dist/main.js"></script>
</body>
</html>
