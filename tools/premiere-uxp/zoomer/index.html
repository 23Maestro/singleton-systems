<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
:root{--bg:#0A0A0A;--raise:#141414;--line:#2A2A2A;--text:#F4F4F4;--dim:#8A8A8A;
  --ok:#22C55E;--warn:#E0B467;--err:#E01F26}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);padding:12px;
  font:12px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
h1{font-size:14px;margin:0 0 2px;font-weight:700;letter-spacing:-.02em}
.sub{color:var(--dim);font-size:11px;margin-bottom:12px}

/* the only variable */
.seg{display:flex;background:var(--raise);border:1px solid var(--line);
  border-radius:9px;padding:3px;margin-bottom:12px}
.seg button{flex:1;background:transparent;border:0;color:var(--dim);font:inherit;
  font-weight:600;padding:7px;border-radius:6px;cursor:pointer}
.seg button.on{background:#242424;color:var(--text);
  box-shadow:0 1px 0 rgba(255,255,255,.06) inset}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.grid.busy{opacity:.45;pointer-events:none}
.p{position:relative;background:var(--raise);border:1px solid var(--line);
  border-left-width:3px;border-radius:10px;padding:10px 11px 11px;cursor:pointer}
.p:hover{background:#1b1b1b}
.p:active{background:#232323}
.p .name{font-weight:700;font-size:12.5px;letter-spacing:-.01em}
.p .kf{position:absolute;right:9px;top:9px;font-size:9px;color:var(--dim)}
.p .spark{display:flex;align-items:flex-end;gap:2px;height:16px;margin:8px 0 7px}
.p .sb{flex:1;border-radius:1px;opacity:.85;min-height:3px}
.p .badge{display:inline-block;font-size:9px;font-weight:700;letter-spacing:.04em;
  text-transform:uppercase;border:1px solid;border-radius:999px;padding:2px 7px}

.row{display:flex;gap:6px}
button.ghost{background:var(--raise);border:1px solid var(--line);color:var(--text);
  font:inherit;border-radius:7px;padding:6px 11px;cursor:pointer}
button.ghost:hover{background:#1c1c1c}
#status{color:var(--dim);font-size:11px;margin:10px 0 0;min-height:15px}
#log{max-height:150px;overflow:auto;font-family:ui-monospace,Menlo,monospace;
  font-size:10px;line-height:1.5;margin-top:8px}
#log div{padding:1px 0;border-bottom:1px solid #1e1e1e;word-break:break-word}
.ok{color:var(--ok)}.warn{color:var(--warn)}.err{color:var(--err)}.dim{color:var(--dim)}
</style>
</head>
<body>

<h1>Zoom Motion</h1>
<div class="sub">Transform-effect presets. Intrinsic Motion is never touched.</div>

<div class="seg" id="scope">
  <button data-mode="selection" class="on">Selected clip</button>
  <button data-mode="all">All clips</button>
</div>

<div class="grid" id="grid"></div>

<div class="row">
  <button class="ghost" id="probe">Probe API</button>
  <button class="ghost" id="clear">Clear log</button>
</div>

<div id="status">Pick a preset to apply it.</div>
<div id="log"><div class="dim">Ready.</div></div>

<script src="dist/main.js"></script>
</body>
</html>
