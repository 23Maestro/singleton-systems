<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
:root{
  --bg:#1e1e1e;--panel:#262626;--line:#3a3a3a;--text:#e8e8e8;--muted:#9b9b9b;
  --accent:#2680eb;--ok:#4caf7d;--warn:#e8a33d;--err:#e35b5b;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font:12px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  padding:12px}
h1{font-size:13px;margin:0 0 2px;font-weight:600;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:11px;margin-bottom:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;
  padding:10px;margin-bottom:10px}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
button{font:inherit;color:var(--text);background:#333;border:1px solid var(--line);
  border-radius:4px;padding:6px 11px;cursor:pointer}
button:hover:not(:disabled){background:#3d3d3d}
button.primary{background:var(--accent);border-color:var(--accent);font-weight:600}
button.primary:hover:not(:disabled){background:#1f6fd0}
button:disabled{opacity:.45;cursor:default}
.kv{display:flex;justify-content:space-between;gap:8px;padding:3px 0;
  border-bottom:1px solid #2f2f2f}
.kv:last-child{border-bottom:0}
.kv span:first-child{color:var(--muted)}
.kv span:last-child{font-variant-numeric:tabular-nums}
#log{max-height:190px;overflow:auto;font-family:ui-monospace,Menlo,monospace;
  font-size:10.5px;line-height:1.5}
#log div{padding:1px 0;border-bottom:1px solid #2b2b2b;word-break:break-word}
.ok{color:var(--ok)}.warn{color:var(--warn)}.err{color:var(--err)}.dim{color:var(--muted)}
.bar{height:3px;background:#333;border-radius:2px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .12s}
label.file{display:block}
input[type=file]{display:none}
.hint{color:var(--muted);font-size:10.5px;margin-top:6px}
</style>
</head>
<body>

<h1>Bad Take Remover</h1>
<div class="sub">Removes Descript-marked bad takes and gaps with ripple deletes.</div>

<div class="card">
  <div class="row">
    <label class="file"><input type="file" id="file" accept=".json">
      <button id="pick">Load cut list…</button></label>
    <button id="probe">Probe API</button>
  </div>
  <div class="hint" id="fileName">No cut list loaded.</div>
</div>

<div class="card" id="stats" style="display:none">
  <div class="kv"><span>Sequence</span><span id="seqName">—</span></div>
  <div class="kv"><span>Sequence length</span><span id="seqDur">—</span></div>
  <div class="kv"><span>Cuts planned</span><span id="nCuts">—</span></div>
  <div class="kv"><span>To remove</span><span id="toRemove">—</span></div>
  <div class="kv"><span>Projected result</span><span id="projected">—</span></div>
  <div class="kv"><span>Skipped / clamped</span><span id="skipped">—</span></div>
</div>

<div class="card">
  <div class="row">
    <button class="primary" id="apply" disabled>Apply cuts</button>
    <button id="refresh">Re-read sequence</button>
  </div>
  <div class="bar"><i id="prog"></i></div>
</div>

<div class="card">
  <div class="row" style="justify-content:space-between;margin-bottom:6px">
    <strong style="font-size:11px">Log</strong>
    <button id="clear" style="padding:2px 8px">Clear</button>
  </div>
  <div id="log"><div class="dim">Ready.</div></div>
</div>

<script src="dist/main.js"></script>
</body>
</html>
